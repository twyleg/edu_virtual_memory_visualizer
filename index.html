<!--
JAVA MEMORY LAB - JSON CONFIGURATION SPECIFICATION
=================================================

Purpose
======-
The Java source code is stored in a separate .java file. The JSON file contains
only the virtual memory layout and a sequence of complete memory snapshots. Each
snapshot is linked to one 1-based source-code line number.

This visualizer deliberately uses a SIMPLE 32-BIT WORD-ADDRESSED TEACHING MODEL.
It is not an attempt to reproduce the physical memory layout of HotSpot or
another JVM.

Each visible memory cell is one complete 32-bit word. Memory addresses therefore
identify words rather than individual bytes. Any address not defined in the
current state contains 0x00000000. States are independent snapshots: no state
inherits values from a previous state and no change/delta calculation is needed.

Canonical JSON structure
========================
{
  "title": "Java Memory Lab",
  "subtitle": "Optional subtitle",
  "modelNote": "Optional note about the teaching model",

  "memory": {
    "static": { "start": 0,  "size": 8 },
    "heap":   { "start": 8,  "size": 24 },
    "stack":  { "start": 32, "size": 32 }
  },

  "states": [
    {
      "line": 3,
      "note": "Optional explanation shown for this source line.",
      "highlight": "main.number",
      "frames": [
        { "id": "main", "label": "main()" }
      ],

      "memory": [
        {
          "id": "main.number",
          "label": "number",
          "region": "stack",
          "frame": "main",
          "address": 31,
          "value": 10
        },
        {
          "id": "main.person",
          "label": "person",
          "region": "stack",
          "frame": "main",
          "address": 30,
          "value": 32,
          "pointsTo": "person.age"
        },
        {
          "id": "person.age",
          "label": "Person.age",
          "region": "heap",
          "address": 32,
          "value": 20
        }
      ]
    }
  ]
}

Required fields
==============-
memory.static.start  First virtual static/class-data word address.
memory.static.size   Number of 32-bit words in the static/class-data region.
memory.heap.start    First virtual heap word address.
memory.heap.size     Number of 32-bit words in the heap region.
memory.stack.start   First virtual stack word address.
memory.stack.size    Number of 32-bit words in the stack region.
states               Array of complete memory snapshots.

For every state:
  line               1-based source-code line to highlight.
  memory             Complete list of defined memory cells in this state.

Optional per-state stack-frame metadata:
  frames             Array of stack-frame definitions. Each frame has a unique
                     id and an optional human-readable label such as "main()"
                     or "add(int, int)".

For every memory cell:
  id                 Unique identifier within the state.
  region             One of "static", "heap", or "stack".
  address            Word address of the 32-bit cell.
  value              32-bit value stored in the cell. Use an integer in the
                     range -2147483648..4294967295. Negative values are shown
                     using their 32-bit two's-complement representation in hex
                     and binary modes.

Optional fields
==============-
title                UI title.
subtitle             UI subtitle.
modelNote            General note displayed below the memory view.
note                 Explanation shown for the current state/source line.
highlight            id of the memory cell selected initially.
label                Human-readable label for the cell.
pointsTo             id of the heap cell representing the referenced object's
                     base address.
frame                For stack cells only: id of the stack frame containing
                     this variable/parameter. The id should match an entry in
                     the state's frames array.

32-bit teaching-model conventions
================================-
- Total virtual memory: 64 words = 256 bytes conceptually.
- Static / Class Data: word addresses 0..7.
- Heap:                word addresses 8..31.
- Stack:               word addresses 32..63.
- ONE visible memory cell = ONE complete 32-bit word.
- Memory is WORD-ADDRESSED, not byte-addressed.
- Every local variable, parameter, primitive value, reference and object field
  occupies exactly one 32-bit memory cell.
- Static/class variables occupy the Static / Class Data region.
- Arrays use one 32-bit cell per element in this teaching model.
- References contain the WORD ADDRESS of the referenced heap object.
- Undefined addresses contain 0x00000000.
- Stack grows downward one word at a time from address 63.
- Heap grows upward one word at a time from address 8.
- Static/class data grows upward one word at a time from address 0.
- No byte order/endian concept is shown because individual bytes are deliberately
  hidden from this introductory model.
- No JVM object headers, alignment gaps or padding are modeled.
- Object fields are stored consecutively in declaration order, one word each.
- Method calls create a new logical stack frame by adding parameter/local cells.
- Stack cells belonging to a method invocation should use the same "frame" id.
- A state's optional "frames" array supplies the visible method label for each
  frame. Frame cells should be contiguous in the stack.
- Parameters are copied into the called method's frame.
- Reference parameters contain the same virtual heap word address.
- When a method returns, its stack-frame cells disappear from the next snapshot.
- The addresses are pedagogical virtual addresses, not physical JVM addresses.

Recommended prompt for creating a new JSON file
================================================
"Create a memory-state JSON file for the attached Java source according to the
JSON specification embedded in java_memory_visualizer_simple.html. Use complete
memory snapshots for each relevant source line. Use the simplified 32-bit
word-addressed teaching model: one memory cell per variable/reference/field,
static/class-data word addresses 0..7, heap word addresses 8..31 growing upward, stack word addresses 32..63 growing downward
upward. Undefined addresses contain 0x00000000."

The JSON configuration is intentionally declarative. The HTML visualizer should
render exactly the supplied snapshots and should not execute Java or infer
missing memory contents.
-->

,"memory":[{"id":"main.age","label":"age = 12","region":"stack","frame":"main","address":63,"value":12},{"id":"main.student","label":"student = true","region":"stack","frame":"main","address":62,"value":1}]},{"line":5,"note":"height is also stored in the main() frame. Its cell contains the 32-bit IEEE-754 representation of 1.65f.","highlight":"main.height","frames":[{"id":"main","label":"main()"}],"memory":[{"id":"main.age","label":"age = 12","region":"stack","frame":"main","address":63,"value":12},{"id":"main.student","label":"student = true","region":"stack","frame":"main","address":62,"value":1},{"id":"main.height","label":"height = 1.65f","region":"stack","frame":"main","address":61,"value":1070805811}]}]}},{"id":"02-stack-frames","label":"3 — Stack frames","source":"public class Main {\n    public static void main(String[] args) {\n        int number = 10;\n        calculate();\n    }\n\n    static void calculate() {\n        int result = 20;\n        boolean valid = true;\n    }\n}\n","config":{"title":"Example 3: Stack frames","subtitle":"A method call creates a separate stack frame for its local variables.","modelNote":"Simplified 32-bit word-addressed teaching model: one memory cell per variable, parameter, reference, or object field.","memory":{"static":{"start":0,"size":8},"heap":{"start":8,"size":24},"stack":{"start":32,"size":32}},"states":[{"line":3,"note":"main() has one local variable, so its stack frame currently contains one cell.","highlight":"main.number","frames":[{"id":"main","label":"main()"}],"memory":[{"id":"main.number","label":"number = 10","region":"stack","frame":"main","address":63,"value":10}]},{"line":7,"note":"Calling calculate() creates a new stack frame above main(). It starts empty because no local variable has been declared yet.","frames":[{"id":"main","label":"main()"},{"id":"calculate","label":"calculate()"}],"memory":[{"id":"main.number","label":"number = 10","region":"stack","frame":"main","address":63,"value":10}]},{"line":8,"note":"result belongs to calculate(), not main(), so it is placed in the new calculate() frame.","highlight":"calculate.result","frames":[{"id":"main","label":"main()"},{"id":"calculate","label":"calculate()"}],"memory":[{"id":"main.number","label":"number = 10","region":"stack","frame":"main","address":63,"value":10},{"id":"calculate.result","label":"result = 20","region":"stack","frame":"calculate","address":62,"value":20}]},{"line":9,"note":"Both local variables of calculate() are grouped in its own stack frame.","highlight":"calculate.valid","frames":[{"id":"main","label":"main()"},{"id":"calculate","label":"calculate()"}],"memory":[{"id":"main.number","label":"number = 10","region":"stack","frame":"main","address":63,"value":10},{"id":"calculate.result","label":"result = 20","region":"stack","frame":"calculate","address":62,"value":20},{"id":"calculate.valid","label":"valid = true","region":"stack","frame":"calculate","address":61,"value":1}]},{"line":4,"note":"After calculate() returns, its complete stack frame disappears. main() remains.","highlight":"main.number","frames":[{"id":"main","label":"main()"}],"memory":[{"id":"main.number","label":"number = 10","region":"stack","frame":"main","address":63,"value":10}]}]}},{"id":"03-call-stack","label":"4 — Call stack","source":"public class Main {\n    public static void main(String[] args) {\n        int a = 1;\n        first();\n    }\n\n    static void first() {\n        int b = 2;\n        second();\n    }\n\n    static void second() {\n        int c = 3;\n        third();\n    }\n\n    static void third() {\n        int d = 4;\n    }\n}\n","config":{"title":"Example 4: Call stack","subtitle":"A chain of method calls pushes and pops stack frames.","modelNote":"Simplified 32-bit word-addressed teaching model: one memory cell per variable, parameter, reference, or object field.","memory":{"static":{"start":0,"size":8},"heap":{"start":8,"size":24},"stack":{"start":32,"size":32}},"states":[{"line":3,"note":"main() starts the call stack.","highlight":"main.a","frames":[{"id":"main","label":"main()"}],"memory":[{"id":"main.a","label":"a = 1","region":"stack","frame":"main","address":63,"value":1}]},{"line":8,"note":"first() is called, so a second frame is pushed onto the stack.","highlight":"first.b","frames":[{"id":"main","label":"main()"},{"id":"first","label":"first()"}],"memory":[{"id":"main.a","label":"a = 1","region":"stack","frame":"main","address":63,"value":1},{"id":"first.b","label":"b = 2","region":"stack","frame":"first","address":62,"value":2}]},{"line":13,"note":"second() adds a third frame.","highlight":"second.c","frames":[{"id":"main","label":"main()"},{"id":"first","label":"first()"},{"id":"second","label":"second()"}],"memory":[{"id":"main.a","label":"a = 1","region":"stack","frame":"main","address":63,"value":1},{"id":"first.b","label":"b = 2","region":"stack","frame":"first","address":62,"value":2},{"id":"second.c","label":"c = 3","region":"stack","frame":"second","address":61,"value":3}]},{"line":18,"note":"third() adds a fourth frame. The call stack now clearly behaves like a stack.","highlight":"third.d","frames":[{"id":"main","label":"main()"},{"id":"first","label":"first()"},{"id":"second","label":"second()"},{"id":"third","label":"third()"}],"memory":[{"id":"main.a","label":"a = 1","region":"stack","frame":"main","address":63,"value":1},{"id":"first.b","label":"b = 2","region":"stack","frame":"first","address":62,"value":2},{"id":"second.c","label":"c = 3","region":"stack","frame":"second","address":61,"value":3},{"id":"third.d","label":"d = 4","region":"stack","frame":"third","address":60,"value":4}]},{"line":14,"note":"third() returns first, so its topmost frame is removed.","highlight":"second.c","frames":[{"id":"main","label":"main()"},{"id":"first","label":"first()"},{"id":"second","label":"second()"}],"memory":[{"id":"main.a","label":"a = 1","region":"stack","frame":"main","address":63,"value":1},{"id":"first.b","label":"b = 2","region":"stack","frame":"first","address":62,"value":2},{"id":"second.c","label":"c = 3","region":"stack","frame":"second","address":61,"value":3}]},{"line":9,"note":"second() returns next.","highlight":"first.b","frames":[{"id":"main","label":"main()"},{"id":"first","label":"first()"}],"memory":[{"id":"main.a","label":"a = 1","region":"stack","frame":"main","address":63,"value":1},{"id":"first.b","label":"b = 2","region":"stack","frame":"first","address":62,"value":2}]},{"line":4,"note":"first() returns, leaving only main().","highlight":"main.a","frames":[{"id":"main","label":"main()"}],"memory":[{"id":"main.a","label":"a = 1","region":"stack","frame":"main","address":63,"value":1}]}]}},{"id":"04-different-callers","label":"5 — Different callers","source":"public class Main {\n    public static void main(String[] args) {\n        int root = 1;\n        first();\n        second();\n    }\n\n    static void first() {\n        int fromFirst = 11;\n        show();\n    }\n\n    static void second() {\n        int fromSecond = 22;\n        show();\n    }\n\n    static void show() {\n        int own = 99;\n    }\n}\n","config":{"title":"Example 5: The same method can have different callers","subtitle":"A stack frame belongs to one method invocation; a method cannot inspect arbitrary caller frames.","modelNote":"Simplified 32-bit word-addressed teaching model: one memory cell per variable, parameter, reference, or object field.","memory":{"static":{"start":0,"size":8},"heap":{"start":8,"size":24},"stack":{"start":32,"size":32}},"states":[{"line":3,"note":"main() starts with its own local variable root.","highlight":"main.root","frames":[{"id":"main","label":"main()"}],"memory":[{"id":"main.root","label":"root = 1","region":"stack","frame":"main","address":63,"value":1}]},{"line":9,"note":"first() is called from main(). Its local variable belongs only to the first() frame.","highlight":"first.fromFirst","frames":[{"id":"main","label":"main()"},{"id":"first","label":"first()"}],"memory":[{"id":"main.root","label":"root = 1","region":"stack","frame":"main","address":63,"value":1},{"id":"first.fromFirst","label":"fromFirst = 11","region":"stack","frame":"first","address":62,"value":11}]},{"line":19,"note":"show() is now called by first(). show() gets its own frame and its own local variable. It cannot access fromFirst directly because that variable belongs to another method's frame.","highlight":"show.own","frames":[{"id":"main","label":"main()"},{"id":"first","label":"first()"},{"id":"show","label":"show()"}],"memory":[{"id":"main.root","label":"root = 1","region":"stack","frame":"main","address":63,"value":1},{"id":"first.fromFirst","label":"fromFirst = 11","region":"stack","frame":"first","address":62,"value":11},{"id":"show.own","label":"own = 99","region":"stack","frame":"show","address":61,"value":99}]},{"line":5,"note":"After show() and first() return, their frames disappear. main() now calls second().","highlight":"main.root","frames":[{"id":"main","label":"main()"}],"memory":[{"id":"main.root","label":"root = 1","region":"stack","frame":"main","address":63,"value":1}]},{"line":14,"note":"This time second() is the caller. Its local variable occupies the same stack position that first() used earlier, because the old frame is gone.","highlight":"second.fromSecond","frames":[{"id":"main","label":"main()"},{"id":"second","label":"second()"}],"memory":[{"id":"main.root","label":"root = 1","region":"stack","frame":"main","address":63,"value":1},{"id":"second.fromSecond","label":"fromSecond = 22","region":"stack","frame":"second","address":62,"value":22}]},{"line":19,"note":"show() is called again, but now its caller is second(). The show() frame itself is the same kind of frame as before; it still cannot directly access the caller's local variable fromSecond.","highlight":"show.own","frames":[{"id":"main","label":"main()"},{"id":"second","label":"second()"},{"id":"show","label":"show()"}],"memory":[{"id":"main.root","label":"root = 1","region":"stack","frame":"main","address":63,"value":1},{"id":"second.fromSecond","label":"fromSecond = 22","region":"stack","frame":"second","address":62,"value":22},{"id":"show.own","label":"own = 99","region":"stack","frame":"show","address":61,"value":99}]}]}},{"id":"05-parameters-return","label":"6 — Parameters & return","source":"public class Main {\n    public static void main(String[] args) {\n        int a = 5;\n        int b = 3;\n        int result = add(a, b);\n    }\n\n    static int add(int x, int y) {\n        int sum = x + y;\n        return sum;\n    }\n}\n","config":{"title":"Example 6: Parameters and return values","subtitle":"Primitive arguments are copied into the callee frame; the return value is transferred back into a reserved caller cell.","modelNote":"Simplified 32-bit word-addressed teaching model: one memory cell per variable, parameter, reference, or object field.","memory":{"static":{"start":0,"size":8},"heap":{"start":8,"size":24},"stack":{"start":32,"size":32}},"states":[{"line":3,"note":"a is a local variable in main().","highlight":"main.a","frames":[{"id":"main","label":"main()"}],"memory":[{"id":"main.a","label":"a = 5","region":"stack","frame":"main","address":63,"value":5}]},{"line":4,"note":"b is stored next to a in the same main() frame.","highlight":"main.b","frames":[{"id":"main","label":"main()"}],"memory":[{"id":"main.a","label":"a = 5","region":"stack","frame":"main","address":63,"value":5},{"id":"main.b","label":"b = 3","region":"stack","frame":"main","address":62,"value":3}]},{"line":5,"note":"Before add() starts, main() reserves one cell for result. The temporary transfer cell directly below main() is also reserved for the value that add() will return.","highlight":"main.result","frames":[{"id":"main","label":"main()"}],"memory":[{"id":"main.a","label":"a = 5","region":"stack","frame":"main","address":63,"value":5},{"id":"main.b","label":"b = 3","region":"stack","frame":"main","address":62,"value":3},{"id":"main.result","label":"result (reserved)","region":"stack","frame":"main","address":61,"value":0},{"id":"return.transfer","label":"return transfer","region":"stack","address":60,"value":0}]},{"line":8,"note":"Calling add(a, b) creates a fixed three-cell stack frame. x and y receive copies of a and b; the third cell is reserved for sum from the beginning.","highlight":"add.x","frames":[{"id":"main","label":"main()"},{"id":"add","label":"add(int, int)"}],"memory":[{"id":"main.a","label":"a = 5","region":"stack","frame":"main","address":63,"value":5},{"id":"main.b","label":"b = 3","region":"stack","frame":"main","address":62,"value":3},{"id":"main.result","label":"result (reserved)","region":"stack","frame":"main","address":61,"value":0},{"id":"return.transfer","label":"return transfer","region":"stack","address":60,"value":0},{"id":"add.x","label":"x = 5","region":"stack","frame":"add","address":59,"value":5},{"id":"add.y","label":"y = 3","region":"stack","frame":"add","address":58,"value":3},{"id":"add.sum","label":"sum (reserved)","region":"stack","frame":"add","address":57,"value":0}]},{"line":9,"note":"sum is calculated inside add(). The size and position of the add() frame do not change.","highlight":"add.sum","frames":[{"id":"main","label":"main()"},{"id":"add","label":"add(int, int)"}],"memory":[{"id":"main.a","label":"a = 5","region":"stack","frame":"main","address":63,"value":5},{"id":"main.b","label":"b = 3","region":"stack","frame":"main","address":62,"value":3},{"id":"main.result","label":"result (reserved)","region":"stack","frame":"main","address":61,"value":0},{"id":"return.transfer","label":"return transfer","region":"stack","address":60,"value":0},{"id":"add.x","label":"x = 5","region":"stack","frame":"add","address":59,"value":5},{"id":"add.y","label":"y = 3","region":"stack","frame":"add","address":58,"value":3},{"id":"add.sum","label":"sum = 8","region":"stack","frame":"add","address":57,"value":8}]},{"line":10,"note":"return sum copies 8 into the transfer cell immediately above the add() frame. That location is known to the caller.","highlight":"return.transfer","frames":[{"id":"main","label":"main()"},{"id":"add","label":"add(int, int)"}],"memory":[{"id":"main.a","label":"a = 5","region":"stack","frame":"main","address":63,"value":5},{"id":"main.b","label":"b = 3","region":"stack","frame":"main","address":62,"value":3},{"id":"main.result","label":"result (reserved)","region":"stack","frame":"main","address":61,"value":0},{"id":"return.transfer","label":"return value = 8","region":"stack","address":60,"value":8},{"id":"add.x","label":"x = 5","region":"stack","frame":"add","address":59,"value":5},{"id":"add.y","label":"y = 3","region":"stack","frame":"add","address":58,"value":3},{"id":"add.sum","label":"sum = 8","region":"stack","frame":"add","address":57,"value":8}]},{"line":5,"note":"After add() returns, its three-cell frame disappears. The value from the transfer cell is copied into the already reserved result cell in main().","highlight":"main.result","frames":[{"id":"main","label":"main()"}],"memory":[{"id":"main.a","label":"a = 5","region":"stack","frame":"main","address":63,"value":5},{"id":"main.b","label":"b = 3","region":"stack","frame":"main","address":62,"value":3},{"id":"main.result","label":"result = 8","region":"stack","frame":"main","address":61,"value":8}]}]}},{"id":"06-first-object","label":"7 — First heap object","source":"public class Main {\n    public static void main(String[] args) {\n        Person person = new Person();\n        person.age = 12;\n        person.student = true;\n        person.height = 1.65f;\n    }\n}\n\nclass Person {\n    int age;\n    boolean student;\n    float height;\n}\n","config":{"title":"Example 7: First object on the heap","subtitle":"An object lives on the heap while the local variable stores a reference on the stack.","modelNote":"Simplified 32-bit word-addressed teaching model: one memory cell per variable, parameter, reference, or object field.","memory":{"static":{"start":0,"size":8},"heap":{"start":8,"size":24},"stack":{"start":32,"size":32}},"states":[{"line":3,"note":"new Person() creates the object's fields on the heap. The local variable person stores only the heap address 8.","highlight":"main.person","frames":[{"id":"main","label":"main()"}],"memory":[{"id":"main.person","label":"person → 8","region":"stack","frame":"main","address":63,"value":8,"pointsTo":"person.age"},{"id":"person.age","label":"Person.age = 0","region":"heap","address":8,"value":0},{"id":"person.student","label":"Person.student = false","region":"heap","address":9,"value":0},{"id":"person.height","label":"Person.height = 0.0f","region":"heap","address":10,"value":0}]},{"line":4,"note":"person.age changes the heap object. The reference on the stack stays exactly the same.","highlight":"person.age","frames":[{"id":"main","label":"main()"}],"memory":[{"id":"main.person","label":"person → 8","region":"stack","frame":"main","address":63,"value":8,"pointsTo":"person.age"},{"id":"person.age","label":"Person.age = 12","region":"heap","address":8,"value":12},{"id":"person.student","label":"Person.student = false","region":"heap","address":9,"value":0},{"id":"person.height","label":"Person.height = 0.0f","region":"heap","address":10,"value":0}]},{"line":5,"note":"student is another field of the same object and therefore occupies another heap cell.","highlight":"person.student","frames":[{"id":"main","label":"main()"}],"memory":[{"id":"main.person","label":"person → 8","region":"stack","frame":"main","address":63,"value":8,"pointsTo":"person.age"},{"id":"person.age","label":"Person.age = 12","region":"heap","address":8,"value":12},{"id":"person.student","label":"Person.student = true","region":"heap","address":9,"value":1},{"id":"person.height","label":"Person.height = 0.0f","region":"heap","address":10,"value":0}]},{"line":6,"note":"The Person object now occupies three consecutive heap cells; person still occupies only one stack cell containing a reference.","highlight":"person.height","frames":[{"id":"main","label":"main()"}],"memory":[{"id":"main.person","label":"person → 8","region":"stack","frame":"main","address":63,"value":8,"pointsTo":"person.age"},{"id":"person.age","label":"Person.age = 12","region":"heap","address":8,"value":12},{"id":"person.student","label":"Person.student = true","region":"heap","address":9,"value":1},{"id":"person.height","label":"Person.height = 1.65f","region":"heap","address":10,"value":1070805811}]}]}},{"id":"07-array-of-persons","label":"8 — Array of Persons","source":"public class Main {\n    public static void main(String[] args) {\n        Person[] people = new Person[4];\n        people[0] = new Person();\n        people[0].age = 12;\n        people[0].student = true;\n        people[0].height = 1.65f;\n        people[1] = new Person();\n        people[1].age = 15;\n        people[1].student = false;\n        people[1].height = 1.80f;\n        people[2] = new Person();\n        people[2].age = 18;\n        people[2].student = true;\n        people[2].height = 1.72f;\n        people[3] = new Person();\n        people[3].age = 21;\n        people[3].student = false;\n        people[3].height = 1.68f;\n    }\n}\n\nclass Person {\n    int age;\n    boolean student;\n    float height;\n}\n","config":{"title":"Example 8: Array of object references","subtitle":"One stack reference points to an array on the heap; the array contains four references to Person objects.","modelNote":"Simplified 32-bit word-addressed teaching model: one memory cell per variable, parameter, reference, array element, or object field.","memory":{"static":{"start":0,"size":8},"heap":{"start":8,"size":24},"stack":{"start":32,"size":32}},"states":[{"line":3,"note":"people is one local reference on the stack. The Person[] object lives on the heap and contains four reference cells, all initially null.","highlight":"main.people","frames":[{"id":"main","label":"main()"}],"memory":[{"id":"main.people","label":"people → 8","region function validate(c){if(!c||!c.memory||!Array.isArray(c.states))throw Error('JSON must contain memory and states.');for(const region of ['static','heap','stack']){const r=c.memory[region];if(!r||!Number.isInteger(r.start)||!Number.isInteger(r.size)||r.size<=0)throw Error(`${region} start and size must be positive integers.`);}for(const st of c.states){if(!Number.isInteger(st.line))throw Error('Every state needs an integer line.');if(!Array.isArray(st.memory))throw Error(`State at line ${st.line} needs a memory array.`);const frameIds=new Set();if(st.frames!==undefined){if(!Array.isArray(st.frames))throw Error(`frames at line ${st.line} must be an array.`);for(const f of st.frames){if(!f||!f.id||frameIds.has(f.id))throw Error(`Each frame at line ${st.line} needs a unique id.`);frameIds.add(f.id);}}const seen=new Set();for(const b of st.memory){if(!b.id||!['static','heap','stack'].includes(b.region)||!Number.isInteger(b.address)||!Number.isInteger(b.value))throw Error(`Invalid memory cell in state at line ${st.line}. Each cell needs id, region, integer address and integer value.`);if(b.value < -2147483648 || b.value > 4294967295)throw Error(`Value of ${b.id} must fit in 32 bits.`);if(seen.has(b.address))throw Error(`Two cells use address ${b.address} in state at line ${st.line}.`);seen.add(b.address);const r=c.memory[b.region];if(b.address<r.start||b.address>=r.start+r.size)throw Error(`Cell ${b.id} exceeds ${b.region}.`);if(b.frame!==undefined){if(b.region!=='stack')throw Error(`Only stack cells may define frame (${b.id}).`);if(!frameIds.has(b.frame))throw Error(`Cell ${b.id} references unknown frame ${b.frame} at line ${st.line}.`);}}for(const fid of frameIds){const addrs=st.memory.filter(b=>b.region==='stack'&&b.frame===fid).map(b=>b.address).sort((a,b)=>a-b);if(!addrs.length)continue;for(let i=1;i<addrs.length;i++)if(addrs[i]!==addrs[i-1]+1)throw Error(`Frame ${fid} at line ${st.line} must use contiguous stack cells.`);} }return c}
function highlightJava(line){
  const frag=document.createDocumentFragment();
  const keywords=new Set('abstract assert break case catch class const continue default do else enum extends final finally for goto if implements import instanceof interface native new package private protected public return static strictfp super switch synchronized this throw throws transient try void volatile while record sealed permits non-sealed var'.split(' '));
  const types=new Set('boolean byte char short int long float double String Object Integer Long Double Float Short Byte Character Boolean'.split(' '));
  let i=0;
  const add=(text,cls)=>{const sp=document.createElement('span');if(cls)sp.className=cls;sp.textContent=text;frag.append(sp)};
  while(i<line.length){
    const rest=line.slice(i);
    if(rest.startsWith('//')){add(rest,'tok-comment');break;}
    if(line[i]==='"' || line[i]==="'"){
      const q=line[i];let j=i+1,esc=false;for(;j<line.length;j++){const ch=line[j];if(esc){esc=false;continue}if(ch==='\\'){esc=true;continue}if(ch===q){j++;break}}
      add(line.slice(i,j),q==='"'?'tok-string':'tok-char');i=j;continue;
    }
    const ann=rest.match(/^@[A-Za-z_$][\w$]*/);if(ann){add(ann[0],'tok-annotation');i+=ann[0].length;continue}
    const num=rest.match(/^(?:0[xX][0-9a-fA-F_]+|0[bB][01_]+|(?:\d[\d_]*\.?[\d_]*|\.\d[\d_]*)(?:[eE][+-]?\d[\d_]*)?)[fFdDlL]?/);if(num){add(num[0],'tok-number');i+=num[0].length;continue}
    const word=rest.match(/^[A-Za-z_$][\w$]*/);if(word){const w=word[0];let cls='';if(keywords.has(w))cls='tok-key';else if(types.has(w) || /^[A-Z]/.test(w))cls='tok-type';else if(w==='true'||w==='false'||w==='null')cls='tok-bool';else{const after=line.slice(i+w.length);if(/^\s*\(/.test(after))cls='tok-method'}add(w,cls);i+=w.length;continue}
    add(line[i]);i++;
  }
  return frag;
}

function applyStackFrames(state){
  const stackGrid=$('stack-grid');
  if(!stackGrid)return;
  stackGrid.querySelectorAll('.frame-edge-left,.frame-edge-right,.frame-edge-top,.frame-edge-bottom').forEach(el=>el.classList.remove('frame-edge-left','frame-edge-right','frame-edge-top','frame-edge-bottom'));
  stackGrid.querySelectorAll('.frame-tag').forEach(el=>el.remove());
  const frames=Array.isArray(state.frames)?state.frames:[];
  const labels=new Map(frames.map(f=>[f.id,f.label||f.id]));
  for(const f of frames){
    const blocks=state.memory.filter(b=>b.region==='stack'&&b.frame===f.id).sort((a,b)=>a.address-b.address);
    if(!blocks.length)continue;
    const first=blocks[0].address,last=blocks[blocks.length-1].address;
    for(let at=first;at<=last;at++){
      const parts=stackGrid.querySelectorAll(`[data-addr="${at}"]`);
      parts.forEach(el=>{if(at===first)el.classList.add('frame-edge-top');if(at===last)el.classList.add('frame-edge-bottom')});
      const addr=stackGrid.querySelector(`.addr[data-addr="${at}"]`);
      const label=stackGrid.querySelector(`.col[data-label-addr="${at}"]`);
      if(addr)addr.classList.add('frame-edge-left');
      if(label)label.classList.add('frame-edge-right');
    }
    const labelCell=stackGrid.querySelector(`.col[data-label-addr="${first}"]`);
    if(labelCell){const tag=document.createElement('span');tag.className='frame-tag';tag.textContent=labels.get(f.id)||f.id;labelCell.prepend(tag);}
  }
}

$('load-source').onclick=()=>$('source-input').click();$('source-input').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;source=await f.text();$('source-name').textContent=f.name;markCustomExample();drawCode();render();e.target.value=''};
$('load-config').onclick=()=>$('config-input').click();$('config-input').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{cfg=validate(JSON.parse(await f.text()));step=0;selected=null;$('config-name').textContent=f.name;markCustomExample();err('');rebuild()}catch(x){err(x.message)}e.target.value=''};
$('prev').onclick=()=>go(step-1);$('next').onclick=()=>go(step+1);$('split-memory').onclick=()=>setMemorySeparated(!memorySeparated);$('theme-toggle').onclick=()=>setTheme(document.documentElement.dataset.theme==='light'?'dark':'light');$('format').onchange=e=>{format=e.target.value;render()};$('menu-toggle').onclick=()=>{const open=document.body.classList.toggle('sidebar-open');$('menu-toggle').setAttribute('aria-expanded',String(open));$('menu-toggle').textContent=open?'×':'☰'};for(const id of ['static-grid','heap-grid','stack-grid'])$(id).addEventListener('click',e=>{const c=e.target.closest('.word');if(!c)return;const b=blockAt(cfg.states[step],Number(c.dataset.addr));if(b){selected=b.id;render()}});
initTheme();
setMemorySeparated(false);
initExamples();
})();
</script>
</body>
</html>
